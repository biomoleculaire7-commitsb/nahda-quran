<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة النهضة بالقرآن — تسجيل القراءة</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#6c0031">
</head>
<body>
<header>
  <img src="logo.png" alt="شعار مدرسة النهضة بالقرآن" class="logo">
  <h1>مدرسة النهضة بالقرآن النموذجية</h1>
  <p>غليزان</p>
  <p>سجّل قراءتك برواية ورش ليصحّحها لك أستاذك</p>
</header>

<main>
  <!-- الدخول -->
  <section id="loginBox" class="card">
    <h2>الدخول</h2>
    <label>رمزك (6 أرقام من أستاذك)</label>
    <input id="codeInput" inputmode="numeric" maxlength="6" placeholder="مثال: 482915">
    <button class="full" id="loginBtn">دخول</button>
    <div id="loginMsg"></div>
    <p class="hint" style="text-align:center;margin-top:14px">أستاذ؟ <a href="teacher.html" style="color:var(--accent);font-weight:700">ادخل من صفحة الأستاذ</a></p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="row" style="align-items:center">
        <div>السلام عليكم يا <b id="studentName"></b><div class="hint" id="teacherLine"></div></div>
        <button class="secondary" id="logoutBtn" style="flex:0">خروج</button>
      </div>
    </div>

    <!-- الواجبات -->
    <div class="card" id="assignCard">
      <h2>واجباتي</h2>
      <div id="assignList"><p class="hint">جارٍ التحميل…</p></div>
    </div>

    <!-- التسجيل -->
    <div class="card">
      <h2>تسجيل جديد</h2>
      <label>السورة</label>
      <select id="surah"></select>
      <div class="row">
        <div><label>من الآية</label><input id="from" type="number" min="1" placeholder="1"></div>
        <div><label>إلى الآية</label><input id="to" type="number" min="1" placeholder="5"></div>
      </div>
      <p class="hint">اقرأ من مصحفك برواية ورش. أقصى مدة للتسجيل 3 دقائق.</p>

      <button class="rec-btn" id="recBtn">🎙️ ابدأ</button>
      <div class="timer" id="timer">0:00</div>

      <div id="preview" class="hidden">
        <audio id="previewAudio" controls></audio>
        <div class="row" style="margin-top:10px">
          <button id="sendBtn">إرسال للأستاذ</button>
          <button class="secondary" id="redoBtn">إعادة التسجيل</button>
        </div>
      </div>
      <div id="recMsg"></div>
    </div>

    <!-- تسجيلاتي -->
    <div class="card">
      <div class="row" style="align-items:center">
        <h2 style="margin:0">تسجيلاتي</h2>
        <button class="secondary" id="refreshBtn" style="flex:0">تحديث</button>
      </div>
      <div id="myList" style="margin-top:10px"></div>
    </div>
  </section>
</main>

<footer>أداة مساعدة للتدريب، ولا تغني عن التلقّي من الأستاذ.</footer>

<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const MAX_SECONDS = 180;
let code = store("nq_code");
let recorder, chunks = [], blob = null, mime = "", tick, seconds = 0;

$("surah").innerHTML = SURAHS.map((n, i) => `<option value="${i + 1}">${i + 1}. ${n}</option>`).join("");

// ---------- الدخول ----------
async function login(c) {
  $("loginMsg").innerHTML = "";
  try {
    const { name, teacher } = await api("/api/login", { method: "POST", body: { code: c } });
    $("teacherLine").textContent = teacher ? `الأستاذ(ة): ${teacher}` : "";
    code = c; store("nq_code", c);
    $("studentName").textContent = name;
    $("loginBox").classList.add("hidden");
    $("app").classList.remove("hidden");
    loadAssignments();
    loadMine();
  } catch (e) {
    if (!/انتظر/.test(e.message)) store("nq_code", null);
    $("loginMsg").innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
}
$("loginBtn").onclick = () => login($("codeInput").value.trim());
$("codeInput").onkeydown = e => { if (e.key === "Enter") $("loginBtn").click(); };
$("logoutBtn").onclick = () => { store("nq_code", null); location.reload(); };
if (code) login(code);

// ---------- التسجيل ----------
function pickMime() {
  for (const m of ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return "";
}

async function startRec() {
  $("recMsg").innerHTML = "";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mime = pickMime();
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 48000 } : undefined);
    mime = recorder.mimeType || mime || "audio/webm";
    chunks = [];
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      blob = new Blob(chunks, { type: mime });
      $("previewAudio").src = URL.createObjectURL(blob);
      $("preview").classList.remove("hidden");
    };
    recorder.start();
    seconds = 0; $("timer").textContent = "0:00";
    tick = setInterval(() => {
      seconds++;
      $("timer").textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      if (seconds >= MAX_SECONDS) stopRec();
    }, 1000);
    $("recBtn").classList.add("on"); $("recBtn").textContent = "⏹ توقّف";
    $("preview").classList.add("hidden");
  } catch (e) {
    $("recMsg").innerHTML = `<div class="msg err">لم نستطع فتح الميكروفون. اسمح للمتصفح باستعماله ثم حاول مرة أخرى.</div>`;
  }
}
function stopRec() {
  clearInterval(tick);
  if (recorder && recorder.state !== "inactive") recorder.stop();
  $("recBtn").classList.remove("on"); $("recBtn").textContent = "🎙️ ابدأ";
}
$("recBtn").onclick = () => (recorder && recorder.state === "recording") ? stopRec() : startRec();
$("redoBtn").onclick = () => { blob = null; $("preview").classList.add("hidden"); $("timer").textContent = "0:00"; };

function toBase64(b) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1]);
    r.onerror = no;
    r.readAsDataURL(b);
  });
}

$("sendBtn").onclick = async () => {
  if (!blob) return;
  $("sendBtn").disabled = true; $("sendBtn").textContent = "جارٍ الإرسال…";
  try {
    await api("/api/recordings", { method: "POST", body: {
      code, surah: $("surah").value, from: $("from").value, to: $("to").value,
      mime, audio: await toBase64(blob)
    }});
    $("recMsg").innerHTML = `<div class="msg ok">وصل تسجيلك إلى أستاذك، بارك الله فيك.</div>`;
    blob = null; $("preview").classList.add("hidden"); $("timer").textContent = "0:00";
    loadMine();
  } catch (e) {
    $("recMsg").innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
  $("sendBtn").disabled = false; $("sendBtn").textContent = "إرسال للأستاذ";
};

// ---------- تسجيلاتي ----------
async function loadMine() {
  $("myList").innerHTML = `<p class="hint">جارٍ التحميل…</p>`;
  try {
    const list = await api(`/api/recordings?code=${encodeURIComponent(code)}`);
    if (!list.length) { $("myList").innerHTML = `<p class="hint">لا توجد تسجيلات بعد.</p>`; return; }
    $("myList").innerHTML = list.map(r => {
      const [label, color] = STATUS[r.status] || STATUS.pending;
      return `<div class="item">
        <div class="row" style="align-items:center"><b>${esc(surahLabel(r))}</b>
          <span style="flex:0;white-space:nowrap" class="badge">${label}</span></div>
        <div class="hint">${new Date(r.created_at).toLocaleDateString("ar-DZ")}</div>
        ${r.note ? `<div class="note">ملاحظة الأستاذ: ${esc(r.note)}</div>` : ""}
        ${r.url ? `<audio controls preload="none" src="${esc(r.url)}"></audio>` : ""}
        <button class="secondary" style="margin-top:8px;padding:8px 12px" data-mydel="${esc(r.id)}">🗑️ حذف</button>
      </div>`;
    }).join("");
    // تلوين الشارات
    $("myList").querySelectorAll(".badge").forEach((b, i) => b.style.background = (STATUS[list[i].status] || STATUS.pending)[1]);
  } catch (e) {
    $("myList").innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
}
$("refreshBtn").onclick = () => { loadAssignments(); loadMine(); };

$("myList").addEventListener("click", async e => {
  const b = e.target.closest("[data-mydel]"); if (!b) return;
  if (!confirm("حذف هذا التسجيل؟ لن يصل إلى أستاذك.")) return;
  b.disabled = true;
  try {
    await api(`/api/recordings?id=${encodeURIComponent(b.dataset.mydel)}&code=${encodeURIComponent(code)}`, { method: "DELETE" });
    loadMine();
  } catch (err) { alert(err.message); b.disabled = false; }
});

// ---------- الواجبات ----------
let assignments = [];
async function loadAssignments() {
  try {
    assignments = await api(`/api/assignments?code=${encodeURIComponent(code)}`);
    if (!assignments.length) { $("assignList").innerHTML = `<p class="hint">لا توجد واجبات حاليًا.</p>`; return; }
    $("assignList").innerHTML = assignments.map((a, i) => `
      <div class="item">
        <b>${esc(surahLabel(a))}</b>
        <div class="hint">${new Date(a.created_at).toLocaleDateString("ar-DZ")}</div>
        ${a.note ? `<div class="note">${esc(a.note)}</div>` : ""}
        <div class="row" style="margin-top:8px">
          <button class="secondary" data-show="${i}">📖 اعرض الآيات</button>
          <button data-rec="${i}">🎙️ سجّل الواجب</button>
        </div>
        <div class="quran hidden" id="q-${i}"></div>
      </div>`).join("");
  } catch (e) {
    $("assignList").innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
}

$("assignList").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.show !== undefined) {
    const i = b.dataset.show, a = assignments[i], box = $(`q-${i}`);
    if (!box.classList.contains("hidden")) { box.classList.add("hidden"); return; }
    box.classList.remove("hidden");
    box.textContent = "جارٍ تحميل الآيات…";
    try {
      const ayat = await warshAyat(a.surah, a.ayah_from, a.ayah_to);
      box.textContent = "";
      if (!ayat.length) { box.textContent = "لم نجد هذه الآيات، راجع أرقامها مع أستاذك."; return; }
      for (const v of ayat) {
        box.append(v.t + " ");
        const n = document.createElement("span"); n.className = "n";
        n.textContent = `﴿${toArabicDigits(v.n)}﴾`;
        box.append(n, " ");
      }
    } catch (err) { box.textContent = err.message; }
  }
  if (b.dataset.rec !== undefined) {
    const a = assignments[b.dataset.rec];
    $("surah").value = a.surah; $("from").value = a.ayah_from; $("to").value = a.ayah_to;
    $("recBtn").scrollIntoView({ behavior: "smooth", block: "center" });
  }
});
</script>
</body>
</html>
